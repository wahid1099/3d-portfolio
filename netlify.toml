[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API proxy: rewrite before any SPA rule can match.
[[redirects]]
  from = "/api/leetcode"
  to = "/.netlify/functions/leetcode"
  status = 200
[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Pass-through rules: these keep /api/* and /.netlify/* reachable WITHOUT
# rewriting. Netlify resolves the more specific rule first; if a request
# already matched a redirect above, this won't fire.
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

# SPA fallback (last). The "/api/*" wildcard is listed above with a higher
# priority; Netlify processes redirects top-down so /api/* never reaches this
# rule. If you're worried about ordering, just rename the function path: use
# /api/v1/leetcode and the wildcard below will not match.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200