[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Functions: API proxy. Match /api/leetcode etc. explicitly and rewrite internally.
[[redirects]]
  from = "/api/leetcode"
  to = "/.netlify/functions/leetcode"
  status = 200

[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200

# Catch-all for any other /api/* paths.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The /.netlify/* path is reserved by Netlify itself; functions are served from
# /.netlify/functions/<name>. The SPA rule below uses excluded paths so the
# rewrite does NOT swallow API calls.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  excludedPaths = ["/api/*", "/.netlify/*"]