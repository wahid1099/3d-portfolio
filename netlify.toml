[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Functions: API proxy. force=true ensures these always trigger.
[[redirects]]
  from = "/api/leetcode"
  to = "/.netlify/functions/leetcode"
  status = 200
  force = true

[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# No SPA fallback: Vite outputs index.html at / and we have no client-side
# routing (every nav is a section anchor #foo). Without the wildcard rewrite,
# /api/* routes only hit the function rules above, never get rewritten to
# index.html.
#
# If you ever add client-side routing, re-add a [[redirects]] rule that
# excludes /api/* and /.netlify/* explicitly.