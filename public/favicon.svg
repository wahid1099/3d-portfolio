<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6fdcef"/>
      <stop offset="100%" stop-color="#4f7dff"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#04060d"/>
  <!-- Fibonacci-sphere lattice, projected -->
  <g stroke="rgba(111,220,239,0.55)" stroke-width="1.2" fill="none">
    <circle cx="32" cy="22" r="3" fill="url(#g)"/>
    <circle cx="20" cy="30" r="3" fill="url(#g)"/>
    <circle cx="44" cy="30" r="3" fill="url(#g)"/>
    <circle cx="32" cy="40" r="3" fill="url(#g)"/>
    <circle cx="24" cy="48" r="3" fill="url(#g)"/>
    <circle cx="40" cy="48" r="3" fill="url(#g)"/>
    <line x1="32" y1="22" x2="20" y2="30"/>
    <line x1="32" y1="22" x2="44" y2="30"/>
    <line x1="20" y1="30" x2="32" y2="40"/>
    <line x1="44" y1="30" x2="32" y2="40"/>
    <line x1="20" y1="30" x2="24" y2="48"/>
    <line x1="44" y1="30" x2="40" y2="48"/>
    <line x1="32" y1="40" x2="24" y2="48"/>
    <line x1="32" y1="40" x2="40" y2="48"/>
  </g>
  <!-- W monogram -->
  <text x="50%" y="58%" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#6fdcef">W</text>
</svg>