      <stop offset="100%" stop-color="#4f7dff"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fdcef"/>
      <stop offset="100%" stop-color="#9a7bff"/>
