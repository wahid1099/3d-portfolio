    <text x="80" y="320" font-size="48" letter-spacing="-1" fill="#b8c4dd" font-weight="500">Software Engineer · Backend · Cloud ·</text>
    <text x="80" y="376" font-size="48" letter-spacing="-1" fill="#b8c4dd" font-weight="500">DevOps · Quantum-Safe Security</text>
  </g>

