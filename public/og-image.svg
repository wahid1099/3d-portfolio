    <line x1="980" y1="240" x2="1060" y2="180"/>
    <line x1="900" y1="180" x2="940" y2="320"/>
    <line x1="1060" y1="180" x2="1020" y2="320"/>
    <line x1="940" y1="320" x2="1020" y2="320"/>
    <line x1="940" y1="320" x2="900" y2="440"/>
    <line x1="1020" y1="320" x2="1060" y2="440"/>
    <line x1="900" y1="440" x2="1060" y2="440"/>
    <line x1="980" y1="240" x2="1000" y2="500"/>
  </g>
  <g fill="url(#node)">
