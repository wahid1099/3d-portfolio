    <circle cx="980" cy="240" r="6"/>
    <circle cx="1060" cy="180" r="6"/>
    <circle cx="940" cy="320" r="6"/>
    <circle cx="1020" cy="320" r="6"/>
    <circle cx="900" cy="440" r="6"/>
    <circle cx="1060" cy="440" r="6"/>
    <circle cx="1000" cy="500" r="8"/>
