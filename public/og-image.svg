    <text x="80" y="588" fill="#8a99b8" font-size="16" letter-spacing="3">linkedin.com/in/md-wahid1</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a99b8" font-size="16" letter-spacing="3">
